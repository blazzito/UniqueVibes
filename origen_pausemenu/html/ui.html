<html>
	<head>
		<title>Origen Network PauseMenu</title>
		<meta charset="UTF-8" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<script
			src="https://kit.fontawesome.com/1c4b4851e0.js"
			crossorigin="anonymous"></script>
		<link href="https://cdn.lineicons.com/3.0/lineicons.css" rel="stylesheet" />
		<link
			href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
			rel="stylesheet" />
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
			rel="stylesheet" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
			crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700&display=swap"
			rel="stylesheet" />
			<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css"
		  />
		<link rel="stylesheet" href="./css/style.css" />
	</head>

	<body>
		<div class="bg dashboard">
			<!-- LEFT SIDEBAR -->
			<div class="dashboard-sidebar">
				<img src="./img/Unique_Clean.png" class="sidebar-logo" />
				<div class="sidebar-menu">
					<div class="sidebar-item btn-sound" action="map">
						<i class="lni lni-map"></i>
						<span>MAPA</span>
					</div>
					<div class="sidebar-item btn-sound" action="settings">
						<i class="lni lni-cog"></i>
						<span>AJUSTES</span>
					</div>
					<div class="sidebar-item btn-sound" action="logout">
						<i class="lni lni-shift-right"></i>
						<span>CERRAR SESIÓN</span>
					</div>
					<div class="sidebar-item btn-sound exit" action="quit">
						<i class="lni lni-power-switch"></i>
						<span>SALIR DEL JUEGO</span>
					</div>
				</div>
				<div class="sidebar-footer">
					<div class="social-btn link btn-sound discord" url=""><i class="lni lni-discord"></i></div>
					<div class="social-btn link btn-sound youtube" url=""><i class="lni lni-tiktok"></i></div>
					<div class="social-btn link btn-sound twitter" url=""><i class="lni lni-twitter-original"></i></div>
					<div class="social-btn link btn-sound instagram" url=""><i class="lni lni-instagram"></i></div>
				</div>
			</div>

			<!-- RIGHT CONTENT AREA -->
			<div class="dashboard-content">
				<!-- PLAYER CARD -->
				<div class="player-card">
					<div class="header-avatar"></div>
					<div class="player-info">
						<div class="d-flex align-items-center gap-3 mb-2">
							<h1 id="name">Nombre del player</h1>
							<span class="badge badge-job" id="job-name">Nombre trabajo</span>
							<span class="badge badge-id">ID: <span id="player-id">0</span></span>
						</div>
						<div class="finances">
							<div class="finance-item cash">
								<div class="show-icon"><i class="lni lni-wallet"></i></div>
								<div class="show-content">
									<div class="show-title">EFECTIVO</div>
									<div id="text-cash">0$</div>
								</div>
							</div>
							<div class="finance-item bank">
								<div class="show-icon"><i class="lni lni-apartment"></i></div>
								<div class="show-content">
									<div class="show-title">DINERO BANCO</div>
									<div id="text-bank">0$</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- WIDGETS -->
				<div class="dashboard-widgets">
					<div class="widget">
						<h2 class="widget-title">COMERCIOS DISPONIBLES</h2>
						<div class="lista-comercios"></div>
					</div>
				</div>
			</div>
		</div>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"
			type="text/javascript"></script>
		<script src="./js/script.js"></script>
	</body>
</html>
