<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <style>

    /* ═══════════════════════════════════════════════
       DESIGN TOKENS  — edit these to retheme the UI
       ═══════════════════════════════════════════════ */
    :root {
      --font:          'Outfit', sans-serif;

      /* Palette */
      --c-blue:        #ff6b00;       /* accent / selected filter - Orange */
      --c-petrol:      #00a8cc;       /* Secondary accent */
      --c-green:       #00a8cc;       /* price badge text */
      --c-green-bg:    rgba(0,168,204,.15); /* price badge bg */
      --c-red:         rgba(255, 107, 0, 0.4); /* remove button bg */
      --c-red-hover:   rgba(255, 107, 0, 0.8); /* remove button hover */
      --c-white-05:    rgba(255,255,255,.05);
      --c-white-10:    rgba(255,255,255,.10);
      --c-white-20:    rgba(255,255,255,.20);
      --c-white-60:    rgba(255,255,255,.60);

      --glass-bg:      rgba(12, 12, 14, 0.95);
      --glass-border:  rgba(255, 255, 255, 0.08);

      /* Scrollbar */
      --scrollbar-w:   2px;
    }

    /* ═══════════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: var(--font);
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

   

    /* Wrapper que agrupa tienda + divider + carrito y se centra */
    #wrapper {
    display: flex;
    align-items: center;
    gap: 2.5rem;
    max-height: 60vh;
    background: var(--glass-bg);
    border: 0.1vh solid var(--glass-border);
    box-shadow: 0 0.5vh 2vh rgba(0, 0, 0, 0.5);
    border-radius: 1rem;
    padding: 2rem;
  }

    /* ═══════════════════════════════════════════════
       SCROLLBAR
       ═══════════════════════════════════════════════ */
    ::-webkit-scrollbar              { width: var(--scrollbar-w); }
    ::-webkit-scrollbar-track        { background: var(--c-white-05); border-radius: 2px; }
    ::-webkit-scrollbar-thumb        { background: #fff; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover  { background: #aaa; }

    /* ═══════════════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════════════ */
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(12px); } }

    .panel { animation: fadeIn .25s ease-out both; }

    /* ═══════════════════════════════════════════════
       SHOP PANEL  (left column)
       ═══════════════════════════════════════════════ */
    #shop-panel {
      width: 800px;
      height: 50vh;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    #shop-panel header h1  { font-size: 1.875rem; font-weight: 500; }
    #shop-panel header span { color: var(--c-white-60); font-size: .875rem; }

    /* Filter tabs & Search */
    #search-input {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-family: var(--font);
      outline: none;
      width: 200px;
      transition: all 0.2s;
    }
    #search-input:focus {
      border-color: var(--c-blue);
      box-shadow: 0 0 0.5vh rgba(255,107,0,0.3);
    }
    #filter-bar {
      display: flex;
      gap: .5rem;
      overflow-x: auto;
      list-style: none;
    }
    #filter-bar li {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      padding: .5rem 1.5rem;
      border-radius: .375rem;
      cursor: pointer;
      font-weight: 500;
      background: var(--c-white-05);
      border: 1px solid transparent;
      transition: all .2s ease-out;
    }
    #filter-bar li:hover,
    #filter-bar li.active { 
      background: rgba(255, 107, 0, 0.15); 
      border-color: rgba(255, 107, 0, 0.4); 
      color: #ff6b00; 
      transform: translateY(-0.1vh);
    }

    /* Item grid */
    #item-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      align-content: start;
      padding-right: .5rem;
    }

    /* ── Item card ── */
    .item-card {
      width: 100%;
      height: 260px;
      background: var(--c-white-05);
      border: 1px solid var(--glass-border);
      border-radius: 0.8rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: all 0.3s;
      position: relative;
    }
    .item-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-0.2vh);
    }
    .item-card .img-container {
      width: 100%;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .item-card img {
      max-width: 80px;
      max-height: 80px;
      object-fit: contain;
    }
    .item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .item-card .item-name { 
      font-size: 1rem; 
      font-weight: 500; 
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-card .price-badge {
      font-size: .75rem;
      font-weight: 600;
      color: var(--c-green);
      background: var(--c-green-bg);
      padding: .2rem .5rem;
      border-radius: .5rem;
      flex-shrink: 0;
    }
    .weight-badge {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      background: rgba(0,0,0,0.6);
      color: #aaa;
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .item-card .item-desc { 
      font-size: .8rem; 
      color: var(--c-white-60); 
      margin-top: .3rem; 
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item-card .add-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 0.5rem;
    }
    .qty-ctrl { display: flex; font-weight: 300; }
    .qty-ctrl button {
      background: var(--c-white-20);
      border: none;
      color: #fff;
      width: 1.25rem;
      height: 1.25rem;
      display: flex; align-items: center; justify-content: center;
      font-size: .875rem;
      cursor: pointer;
    }
    .qty-ctrl button:first-child { border-radius: .25rem 0 0 .25rem; }
    .qty-ctrl button:last-child  { border-radius: 0 .25rem .25rem 0; }
    .qty-display {
      background: var(--c-white-10);
      width: 1.25rem;
      height: 1.25rem;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem;
      font-weight: 500;
    }
    .add-btn {
      background: none;
      border: none;
      color: #fff;
      font-family: var(--font);
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      transition: color .15s;
    }
    .add-btn:hover { color: var(--c-blue); }

    /* Bounce animation for add-btn */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); color: var(--c-blue); }
      100% { transform: scale(1); }
    }
    .pop-anim {
      animation: pop 0.3s ease-out;
    }

    /* ═══════════════════════════════════════════════
       DIVIDER
       ═══════════════════════════════════════════════ */
    .divider-v { width: 1px; height: 100%; background: var(--c-white-10); flex-shrink: 0; }
    .divider-h { width: 100%; height: 1px; background: var(--c-white-10); margin: 1rem 0; }

    /* ═══════════════════════════════════════════════
       CART PANEL  (right column)
       ═══════════════════════════════════════════════ */
    #cart-panel {
      width: 420px;
      height: 50vh;
      display: flex;
      flex-direction: column;
    }

    #cart-panel header h1  { font-size: 1.875rem; font-weight: 500; }
    #cart-panel header span { color: var(--c-white-60); font-size: .875rem; }

    #cart-items {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2.5rem;
      padding-right: 1rem;
      max-height: 35vh;
    }

    /* ── Cart item row ── */
    .cart-row {
      background: var(--c-white-05);
      border-radius: .5rem;
      padding: .625rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .625rem;
    }
    .cart-row-left {
      display: flex;
      align-items: center;
      gap: .625rem;
      flex: 1;
    }
    .cart-thumb {
      width: 3.5rem; height: 3.5rem;
      background: var(--c-white-10);
      border-radius: .25rem;
      padding: .375rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cart-thumb img { width: 100%; height: auto; }
    .cart-label { font-size: .875rem; word-break: break-word; width: 75%; }

    .cart-row-right {
      display: flex;
      align-items: center;
      gap: .625rem;
    }
    .cart-qty-ctrl { display: flex; font-weight: 300; }
    .cart-qty-ctrl button {
      background: var(--c-white-20);
      border: none;
      color: #fff;
      width: 1.25rem;
      height: 1.75rem;
      display: flex; align-items: center; justify-content: center;
      font-size: .875rem;
      cursor: pointer;
    }
    .cart-qty-ctrl button:first-child { border-radius: .25rem 0 0 .25rem; }
    .cart-qty-ctrl button:last-child  { border-radius: 0 .25rem .25rem 0; }
    .cart-qty-display {
      background: var(--c-white-10);
      width: 1.25rem;
      height: 1.75rem;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 500;
    }
    .cart-price-badge {
      height: 1.75rem;
      padding: 0 .25rem;
      background: var(--c-green-bg);
      color: var(--c-green);
      font-size: .75rem; font-weight: 500;
      display: flex; align-items: center;
      border-radius: .25rem 0 0 .25rem;
    }
    .cart-remove {
      width: 1.25rem; height: 1.75rem;
      background: var(--c-red);
      border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: 0 .25rem .25rem 0;
      transition: all .15s;
    }
    .cart-remove:hover { 
      background: var(--c-red-hover); 
      box-shadow: 0 0 0.4vh rgba(255, 107, 0, 0.4); 
    }

    /* ── Payment section ── */
    #payment-section { margin-top: 1rem; }
    #payment-section h2 { color: var(--c-white-60); font-size: .875rem; font-weight: 400; }

    #payment-btns {
      display: flex;
      gap: .5rem;
      margin-top: 1rem;
    }
    .pay-btn {
      flex: 1;
      background: var(--c-white-05);
      border: none;
      border-radius: .5rem;
      color: #fff;
      font-family: var(--font);
      font-size: .875rem;
      font-weight: 500;
      padding: .5rem .75rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .2s ease-out;
    }
    .pay-btn:hover,
    .pay-btn.active { 
      background: rgba(255, 107, 0, 0.15);
      border-color: rgba(255, 107, 0, 0.4);
      color: #ff6b00;
      transform: translateY(-0.1vh);
    }
    .pay-btn svg    { flex-shrink: 0; }

    /* ── Footer: total + confirm ── */
    #cart-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .75rem;
      margin-top: 1.5rem;
      height: 5.2vh;
    }
    #total-block { text-align: right; }
    #total-label { font-size: .875rem; color: var(--c-white-60); }
    #total-amount { font-weight: 500; }

    #confirm-btn {
      background: rgba(255, 107, 0, 0.15);
      border: 1px solid rgba(255, 107, 0, 0.4);
      border-radius: .5rem;
      color: #ff6b00;
      font-family: var(--font);
      font-size: .875rem;
      font-weight: 500;
      padding: .5rem 1.25rem;
      cursor: pointer;
      transition: all .2s;
      height: 100%;
    }
    #confirm-btn:hover   { 
      background: rgba(255, 107, 0, 0.25);
      box-shadow: 0 0 1vh rgba(255, 107, 0, 0.4);
      color: #fff;
    }
    #confirm-btn:disabled { opacity: .4; cursor: default; }

    /* ═══════════════════════════════════════════════
       EMPTY CART STATE
       ═══════════════════════════════════════════════ */
    #empty-cart {
      color: var(--c-white-60);
      font-size: .875rem;
      margin-top: 2.5rem;
    }

    /* ═══════════════════════════════════════════════
       HIDDEN UTILITY
       ═══════════════════════════════════════════════ */
    .hidden { display: none !important; }

  </style>
</head>
<body>

<div id="wrapper" class="hidden">

<div id="shop-panel" class="panel">
  <header style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h1 id="shop-name">Tienda</h1>
      <span id="shop-desc"></span>
    </div>
    <input type="text" id="search-input" placeholder="Buscar producto..." />
  </header>
  <ul id="filter-bar"></ul>
  <div id="item-grid"></div>
</div>

<div class="divider-v" id="divider"></div>

<div id="cart-panel" class="panel">
  <header>
    <h1 id="cart-title">Carrito</h1>
    <span id="cart-count">0 artículos en el carrito</span>
  </header>

  <div id="cart-items">
    <p id="empty-cart"></p>
  </div>

  <div class="divider-h"></div>

  <div id="payment-section">
    <h2 id="lbl-payment">Método de pago</h2>
    <div id="payment-btns">
      <button class="pay-btn active" data-method="bank">
        <svg width="21" height="14" viewBox="0 0 21 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7.5708 1.9585H13.1822V12.0412H7.5708V1.9585Z" fill="#FF5F00"/>
          <path d="M7.92727 6.99996C7.92727 4.95138 8.8892 3.13431 10.3677 1.95856C9.28114 1.1035 7.9095 0.586914 6.41313 0.586914C2.86801 0.586914 0 3.45493 0 6.99996C0 10.5449 2.86801 13.413 6.41305 13.413C7.90942 13.413 9.28106 12.8964 10.3677 12.0413C8.8892 10.8834 7.92727 9.04854 7.92727 6.99996Z" fill="#EB001B"/>
          <path d="M20.753 6.99996C20.753 10.5449 17.885 13.413 14.3399 13.413C12.8436 13.413 11.4719 12.8964 10.3853 12.0413C11.8816 10.8656 12.8258 9.04854 12.8258 6.99996C12.8258 4.95138 11.8638 3.13431 10.3853 1.95856C11.4718 1.1035 12.8436 0.586914 14.3399 0.586914C17.885 0.586914 20.753 3.47278 20.753 6.99996H20.753Z" fill="#F79E1B"/>
        </svg>
        <span id="lbl-bank">Banco</span>
      </button>
      <button class="pay-btn" data-method="money">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="6" width="20" height="12" rx="2" stroke="white" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.5"/>
          <path d="M6 10V14M18 10V14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="lbl-cash">Efectivo</span>
      </button>
    </div>
  </div>

  <div id="cart-footer">
    <div id="total-block">
      <div id="total-label">Precio total</div>
      <div id="total-amount">$0</div>
    </div>
    <div class="divider-v" style="height:100%"></div>
    <button id="confirm-btn" disabled></button>
  </div>
</div>


</div> <!-- #wrapper -->
<script>
/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
let locale      = {};
let imageBase   = '../images/';
let currentShopKey = null;
let activeFilter   = '';
let searchQuery    = '';
let allItems       = [];
let cartItems      = [];
let payment        = 'bank';

/* qty per item card — keyed by item name */
const cardQty = {};

/* ═══════════════════════════════════════════════════════════════
   DOM REFS
   ═══════════════════════════════════════════════════════════════ */
const $shopPanel  = document.getElementById('shop-panel');
const $cartPanel  = document.getElementById('cart-panel');
const $divider    = document.getElementById('divider');
const $shopName   = document.getElementById('shop-name');
const $shopDesc   = document.getElementById('shop-desc');
const $filterBar  = document.getElementById('filter-bar');
const $itemGrid   = document.getElementById('item-grid');
const $cartItems  = document.getElementById('cart-items');
const $emptyCart  = document.getElementById('empty-cart');
const $cartCount  = document.getElementById('cart-count');
const $cartTitle  = document.getElementById('cart-title');
const $totalAmt   = document.getElementById('total-amount');
const $totalLabel = document.getElementById('total-label');
const $confirmBtn = document.getElementById('confirm-btn');
const $payBtns    = document.querySelectorAll('.pay-btn');

/* ═══════════════════════════════════════════════════════════════
   NUI HELPERS
   ═══════════════════════════════════════════════════════════════ */
async function nuiPost(event, data = {}) {
  try {
    const res = await fetch(`https://${GetParentResourceName()}/${event}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    return await res.json();
  } catch { return null; }
}

/* ═══════════════════════════════════════════════════════════════
   SHOW / HIDE
   ═══════════════════════════════════════════════════════════════ */
const $wrapper = document.getElementById('wrapper');

function showUI() {
  document.body.classList.add('ui-open');
  $wrapper.classList.remove('hidden');
  document.getElementById('search-input').value = '';
  searchQuery = '';
}

function hideUI() {
  document.body.classList.remove('ui-open');
  $wrapper.classList.add('hidden');
  cartItems = [];
  currentShopKey = null;
  renderCart();
}

/* ═══════════════════════════════════════════════════════════════
   LOCALE LABELS
   ═══════════════════════════════════════════════════════════════ */
function applyLocale(l) {
  locale = l || {};
  document.getElementById('lbl-bank').textContent  = locale.bank        || 'Banco';
  document.getElementById('lbl-cash').textContent  = locale.money       || 'Efectivo';
  document.getElementById('lbl-payment').textContent = locale.paymentMethod || 'Método de pago';
  $confirmBtn.textContent                           = locale.pay         || 'Pagar';
  $totalLabel.textContent                           = locale.moneyAmount || 'Precio total';
}

/* ═══════════════════════════════════════════════════════════════
   FILTER BAR
   ═══════════════════════════════════════════════════════════════ */
function getIconForFilter(key) {
  const icons = {
    food: 'ri-restaurant-line',
    drinks: 'ri-cup-line',
    weapons: 'ri-sword-line',
    tools: 'ri-tools-line',
    hardware: 'ri-hammer-line',
    clothes: 'ri-t-shirt-line',
    electronics: 'ri-plug-line'
  };
  return icons[key.toLowerCase()] || 'ri-price-tag-3-line';
}

function renderFilters(filters) {
  $filterBar.innerHTML = '';
  activeFilter = '';

  const mkFilter = (key, label, isAll) => {
    const li = document.createElement('li');
    li.innerHTML = `<i class="${isAll ? 'ri-apps-2-line' : getIconForFilter(key)}"></i> ${label}`;
    li.dataset.key = key;
    if (key === activeFilter) li.classList.add('active');
    li.addEventListener('click', () => {
      nuiPost('playSound', {sound: "NAV_UP_DOWN", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
      activeFilter = key;
      document.querySelectorAll('#filter-bar li').forEach(el =>
        el.classList.toggle('active', el.dataset.key === key));
      renderItems();
    });
    return li;
  };

  $filterBar.appendChild(mkFilter('', locale.allItemsFilter || 'Todos', true));
  for (const [key, label] of Object.entries(filters || {})) {
    $filterBar.appendChild(mkFilter(key, label, false));
  }
}

/* ═══════════════════════════════════════════════════════════════
   ITEM GRID
   ═══════════════════════════════════════════════════════════════ */
function renderItems() {
  $itemGrid.innerHTML = '';
  let filtered = activeFilter
    ? allItems.filter(i => i.type === activeFilter)
    : allItems;

  if (searchQuery.trim() !== '') {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(i => (i.label || i.name).toLowerCase().includes(q));
  }

  for (const item of filtered) {
    if (!cardQty[item.name]) cardQty[item.name] = 1;

    const card = document.createElement('div');
    card.className = 'item-card';

    let weightHtml = '';
    if (item.weight) {
        weightHtml = `<div class="weight-badge"><i class="ri-weight-line"></i> ${item.weight}</div>`;
    }

    card.innerHTML = `
      ${weightHtml}
      <div class="img-container">
        <img src="${imageBase}${item.name}.png" alt="${item.label || item.name}"
             onerror="this.style.opacity='.3'" />
      </div>
      <div class="item-info">
        <div class="item-header">
          <span class="item-name">${item.label || item.name}</span>
          <span class="price-badge">$ ${locale._priceHidden ? '—' : (item.price ?? '—')}</span>
        </div>
        <p class="item-desc">${item.description || ''}</p>
      </div>
      <div class="add-row">
        <div class="qty-ctrl">
          <button class="qty-minus">−</button>
          <div class="qty-display">${cardQty[item.name]}</div>
          <button class="qty-plus">+</button>
        </div>
        <button class="add-btn">${locale.addToCart || 'Agregar'}</button>
      </div>
    `;

    const qtyDisplay = card.querySelector('.qty-display');
    const addBtn = card.querySelector('.add-btn');

    card.querySelector('.qty-plus').addEventListener('click', () => {
      nuiPost('playSound', {sound: "NAV_UP_DOWN", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
      cardQty[item.name] = (cardQty[item.name] || 1) + 1;
      qtyDisplay.textContent = cardQty[item.name];
    });

    card.querySelector('.qty-minus').addEventListener('click', () => {
      nuiPost('playSound', {sound: "NAV_UP_DOWN", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
      cardQty[item.name] = Math.max(1, (cardQty[item.name] || 1) - 1);
      qtyDisplay.textContent = cardQty[item.name];
    });

    addBtn.addEventListener('click', () => {
      nuiPost('playSound', {sound: "SELECT", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
      addBtn.classList.remove('pop-anim');
      void addBtn.offsetWidth; 
      addBtn.classList.add('pop-anim');
      addToCart(item, cardQty[item.name] || 1);
    });

    $itemGrid.appendChild(card);
  }
}

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderItems();
});

/* ═══════════════════════════════════════════════════════════════
   CART
   ═══════════════════════════════════════════════════════════════ */
function addToCart(item, amount) {
  const existing = cartItems.find(c => c.name === item.name);
  if (existing) {
    existing.amount += amount;
  } else {
    cartItems.push({ ...item, amount });
  }
  renderCart();
}

function renderCart() {
  $cartItems.innerHTML = '';

  if (cartItems.length === 0) {
    const p = document.createElement('p');
    p.id = 'empty-cart';
    p.style.color = 'var(--c-white-60)';
    p.style.fontSize = '.875rem';
    p.style.marginTop = '2.5rem';
    $cartItems.appendChild(p);
    $cartCount.textContent = '0 ' + (locale.itemsInCart || 'artículos en el carrito');
    $totalAmt.textContent  = '$0';
    $confirmBtn.disabled   = true;
    return;
  }

  let total = 0;

  cartItems.forEach((item, idx) => {
    /* price display — server resolves real price, UI shows placeholder if no price */
    const linePrice = item.price != null ? item.price * item.amount : null;
    if (linePrice != null) total += linePrice;

    const row = document.createElement('div');
    row.className = 'cart-row';
    row.innerHTML = `
      <div class="cart-row-left">
        <div class="cart-thumb">
          <img src="${imageBase}${item.name}.png" alt="${item.label || item.name}"
               onerror="this.style.opacity='.3'" />
        </div>
        <span class="cart-label">${item.label || item.name}</span>
      </div>
      <div class="cart-row-right">
        <div class="cart-qty-ctrl">
          <button class="cqty-plus">+</button>
          <div class="cart-qty-display">${item.amount}</div>
          <button class="cqty-minus">−</button>
        </div>
        <div style="display:flex">
          <div class="cart-price-badge">${linePrice != null ? '$ ' + linePrice : '—'}</div>
          <button class="cart-remove" title="Quitar">
            <svg width="9" height="11" viewBox="0 0 9 11" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0.45 2.8H1.35M1.35 2.8H8.55M1.35 2.8V9.1C1.35 9.34 1.445 9.57 1.614 9.736C1.783 9.905 2.012 10 2.25 10H6.75C6.989 10 7.218 9.905 7.387 9.736C7.555 9.57 7.65 9.34 7.65 9.1V2.8H1.35ZM2.7 2.8V1.9C2.7 1.661 2.795 1.432 2.964 1.264C3.133 1.095 3.362 1 3.6 1H5.4C5.639 1 5.868 1.095 6.037 1.264C6.205 1.432 6.3 1.661 6.3 1.9V2.8"
                stroke="white" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    `;

    const qtyDisplay = row.querySelector('.cart-qty-display');
    const priceTag   = row.querySelector('.cart-price-badge');

    row.querySelector('.cqty-plus').addEventListener('click', () => {
      nuiPost('playSound', {sound: "NAV_UP_DOWN", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
      item.amount++;
      qtyDisplay.textContent = item.amount;
      if (item.price != null) priceTag.textContent = '$ ' + item.price * item.amount;
      updateTotal();
    });
    row.querySelector('.cqty-minus').addEventListener('click', () => {
      if (item.amount > 1) {
        nuiPost('playSound', {sound: "NAV_UP_DOWN", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
        item.amount--;
        qtyDisplay.textContent = item.amount;
        if (item.price != null) priceTag.textContent = '$ ' + item.price * item.amount;
        updateTotal();
      }
    });
    row.querySelector('.cart-remove').addEventListener('click', () => {
      nuiPost('playSound', {sound: "CANCEL", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
      cartItems.splice(idx, 1);
      renderCart();
    });

    $cartItems.appendChild(row);
  });

  $cartCount.textContent = cartItems.length + ' ' + (locale.itemsInCart || 'artículos en el carrito');
  $totalAmt.textContent  = '$ ' + total;
  $confirmBtn.disabled   = false;
}

function updateTotal() {
  let total = 0;
  cartItems.forEach(i => { if (i.price != null) total += i.price * i.amount; });
  $totalAmt.textContent = '$ ' + total;
}

/* ═══════════════════════════════════════════════════════════════
   PAYMENT METHOD
   ═══════════════════════════════════════════════════════════════ */
$payBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    nuiPost('playSound', {sound: "NAV_UP_DOWN", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
    payment = btn.dataset.method;
    $payBtns.forEach(b => b.classList.toggle('active', b === btn));
  });
});

/* ═══════════════════════════════════════════════════════════════
   CONFIRM PURCHASE
   ═══════════════════════════════════════════════════════════════ */
$confirmBtn.addEventListener('click', async () => {
  if (cartItems.length === 0 || !currentShopKey) return;
  nuiPost('playSound', {sound: "SELECT", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
  $confirmBtn.disabled = true;

  /* Send only name+amount to server — prices resolved server-side */
  const payload = {
    shopKey: currentShopKey,
    payment: payment,
    items: cartItems.map(i => ({ name: i.name, amount: i.amount })),
  };

  const success = await nuiPost('buy', payload);

  if (success) {
    nuiPost('playSound', {sound: "CASH_REGISTER", dict: "ROBBERY_MONEY_TOTAL"});
    /* Close UI on successful purchase */
    cartItems = [];
    renderCart();
    await nuiPost('closeUi', {});
    hideUI();
  } else {
    $confirmBtn.disabled = false;
  }
});

/* ═══════════════════════════════════════════════════════════════
   CLOSE ON ESC
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('keyup', async (e) => {
  if (e.key === 'Escape') {
    nuiPost('playSound', {sound: "CANCEL", dict: "HUD_FRONTEND_DEFAULT_SOUNDSET"});
    await nuiPost('closeUi', {});
    hideUI();
  }
});

/* ═══════════════════════════════════════════════════════════════
   NUI MESSAGE HANDLER
   ═══════════════════════════════════════════════════════════════ */
window.addEventListener('message', (e) => {
  const msg = e.data;
  switch (msg.type) {

    case 'set-locale':
      applyLocale(msg.locale);
      break;

    case 'set-images':
      imageBase = msg.location || '../images/';
      break;

    case 'main-container':
      if (msg.show) {
        showUI();
      } else {
        hideUI();
      }
      break;

    case 'shop-container':
      currentShopKey         = msg.shopKey || null;
      $shopName.textContent  = msg.name        || '';
      $shopDesc.textContent  = msg.description || '';
      $cartTitle.textContent = locale.cart     || 'Carrito';
      allItems               = msg.items       || [];
      cartItems              = [];
      renderFilters(msg.filters);
      renderItems();
      renderCart();
      break;

    case 'purchase-success':
      cartItems = [];
      renderCart();
      break;
  }
});
</script>
